name: CI

# Headless, engine-agnostic quality gate for Elyndor. No Godot, no display.
# Mirrors `python scripts/ci_quality_gate.py --pytest` (see Makefile / README).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Full pytest suite
        run: python -m pytest -q

      - name: Tactical combat verification
        run: python -m tactical.verify

      - name: Region Completion Review
        run: python -m tactical.living_world.region_review

      - name: CI quality gate (contracts + save round-trip + docs)
        run: python scripts/ci_quality_gate.py

# The single command below reproduces the whole gate locally:
#   python scripts/ci_quality_gate.py --pytest
